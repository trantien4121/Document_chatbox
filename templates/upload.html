<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Chatbox</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='uploads.css') }}">
</head>
<body>
    <div class="container">
        <h1>Document AI Chatbox</h1>
        <!-- <h5 style="margin-bottom: -20px;">Chọn file (có thể chọn nhiều file):</h5>
        <form action="/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="files" accept=".pdf" multiple required>
            <button class="btn-load" type="submit">Tải lên</button>
        </form>

        {% if file_names %}
            <div class="file-loaded-area">
                <h5 style="margin-bottom: -5px ; color: green">
                    <i class="fas fa-check" style="margin-right: 10px;"></i>
                    File đã tải lên thành công:
                </h5>
                <ul>
                    {% for file_name in file_names %}
                        <li>{{ file_name }}</li>
                    {% endfor %}
                </ul>
            </div> 
        {% endif %} -->

        <form action="/upload" method="post" enctype="multipart/form-data" id="uploadForm">
            <div class="file-upload" onclick="document.getElementById('fileInput').click();">
                <input type="file" id="fileInput" name="files" accept=".pdf" multiple required onchange="showFileNames(this.files)">
                <div class="upload-text">Click or Drag files to upload</div>
                <div class="file-names" id="fileNames"></div>
                <div class="button-container">
                    <button type="button" class="button" onclick="addMoreFiles(event)">
                        <i class="fas fa-plus"></i> Add More
                    </button>
                </div>
            </div>
        </form>

        <h2>Typing to ask and answer from your documents!</h2>
        <form action="/ask" method="post">
            <div class="ask-area">
                <input type="text" name="question" placeholder="Nhập câu hỏi của bạn" required>
                <button class="btn-ask" type="submit">
                    <i class="fas fa-paper-plane"></i> Ask
                </button>
            </div>
        </form>

        {% if chat_history %}
            <div class="answer-section">
                <div class="chat-history">
                    {% for chat in chat_history %}
                        <div class="chat-message">
                            <div class="question"><strong>Câu hỏi:</strong> {{ chat.question }}</div>
                            <div class="answer">
                                <strong>Kết quả:</strong>
                                <ul>
                                    {% for answer in chat.answers %}
                                        <li>{{ answer | safe }}</li>
                                    {% endfor %}
                                </ul>
                            </div>
                        </div>
                    {% endfor %}
                </div>
            </div>
        {% endif %}
        
    </div>
    
    <script>
        // Tìm và focus vào phần tử chứa câu trả lời gần nhất
        const lastAnswer = document.querySelector('.chat-history .chat-message:last-child .answer');
        if (lastAnswer) {
            lastAnswer.scrollIntoView({ behavior: 'smooth' });
        }

        /*Custom upload file*/
        const fileNamesDiv = document.getElementById('fileNames');
        const fileInput = document.getElementById('fileInput');
        const uploadForm = document.getElementById('uploadForm');
        let selectedFiles = [];

        function initialize() {
            const storedFiles = JSON.parse(localStorage.getItem('uploadedFiles')) || [];
            selectedFiles = storedFiles.map(fileStored => {
                const byteString = atob(fileStored.content.split(',')[1]); // Giải mã nội dung
                const mimeString = fileStored.content.split(',')[0].split(':')[1].split(';')[0]; // Lấy kiểu MIME
                const arrayBuffer = new Uint8Array(byteString.length);
                
                for (let i = 0; i < byteString.length; i++) {
                    arrayBuffer[i] = byteString.charCodeAt(i);
                }

                const blob = new Blob([arrayBuffer], { type: mimeString }); // Tạo Blob từ ArrayBuffer
                return new File([blob], fileStored.name, { type: fileStored.type, size: fileStored.size });
            });
            displayFileNames();
            updateFileInput();
        }   

        function saveFilesToLocalStorage() {
            const fileDataPromises = selectedFiles.map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        resolve({
                            name: file.name,
                            type: file.type,
                            size: file.size,
                            content: event.target.result // Nội dung file
                        });
                    };
                    reader.readAsDataURL(file); // Đọc file dưới dạng Data URL
                });
            });

            Promise.all(fileDataPromises).then(fileData => {
                localStorage.setItem('uploadedFiles', JSON.stringify(fileData));
            });
        }

        function saveFilesToIndexedDB() {
            selectedFiles.forEach(file => {
                saveFileToIndexedDB(file);
            });
        }
        function showFileNames(files) {
            for (let file of files) {
                selectedFiles.push(file);
            }
            displayFileNames();
            updateFileInput();
            saveFilesToLocalStorage(); // Lưu file vào localStorage ngay sau khi thêm file mới (có thể ko cần)
            uploadFiles(); // Tự động gửi form mỗi khi có file mới
        }

        function displayFileNames() {
            fileNamesDiv.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                fileNamesDiv.innerHTML += `
                    <div class="file-item">
                        <span>${file.name}</span>
                        <button class="remove-button" onclick="removeFile(${index}); event.stopPropagation();">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>`;
            });
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            displayFileNames();
            updateFileInput(); 
            saveFilesToLocalStorage(); // Lưu file vào localStorage sau khi xóa
            uploadFiles(); // Tự động gửi form sau khi xóa file
        }

        function addMoreFiles(event) {
            event.stopPropagation(); // Ngăn chặn sự kiện lan truyền
            fileInput.click();
        }

        function updateFileInput() {
            const dataTransfer = new DataTransfer();
            selectedFiles.forEach(file => dataTransfer.items.add(file));
            fileInput.files = dataTransfer.files; // Cập nhật files trong input
        }

        function uploadFiles() {
            const formData = new FormData(uploadForm);
            fetch(uploadForm.action, {
                method: uploadForm.method,
                body: formData
            })
            .then(response => {
                if (response.ok) {
                    console.log("Files uploaded successfully.");
                    saveFilesToLocalStorage();
                    displayFileNames(); // Cập nhật lại giao diện
                } else {
                    console.error("Upload failed.");
                }
            })
            .catch(error => {
                console.error("Error uploading files:", error);
            });
        }
        // Khởi tạo khi trang được tải
        initialize();
    </script>
</body>
</html>
